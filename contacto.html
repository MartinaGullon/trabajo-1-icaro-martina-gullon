<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

<body>
    <header>
        <h1>Contacto</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="clasificacion.html">Clasificación</a></li>
                <li><a href="noticias.html">Noticias</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section>
        <h2>Formulario de Contacto</h2>
        <p>Completa el formulario para dejarnos tu mensaje sobre la temporada 2026 de Fórmula 1.</p>

        <form>
            <div>
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" required><br><br>
            </div>

            <div>
                <label for="email">Correo electrónico:</label><br>
                <input type="email" id="email" name="email" required><br><br>
            </div>

            <div>
                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" rows="5" required></textarea><br><br>
            </div>

            <button type="submit">Enviar</button>
        </form>
    </section>

    <section>
        <h2>Enlaces útiles</h2>
        <p>Visita la <a href="https://www.formula1.com" target="_blank">web oficial de la Fórmula 1</a> para más
            información.</p>
    </section>

    <footer>
        <p>© 2026 Fórmula 1 Fan Page</p>
    </footer>

</body>

</html>
